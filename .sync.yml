---
".gitlab-ci.yml":
  delete: true
appveyor.yml:
  delete: true
.rubocop.yml:
  include_todos: true
spec/spec_helper.rb:
  mock_with: ":rspec"
  coverage_report: true
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
.github/workflows/ci.yml:
  unmanaged: false
  # acceptance flags set by hand (Puppet 9 platform excludes) (MODULES-11997 pdk update)
  acceptance_flags:
  - "--nightly"
  - "--arch-exclude arm"
  - "--collection-platform-exclude 9:redhat-7"
  - "--collection-platform-exclude 9:centos-7"
  - "--collection-platform-exclude 9:oraclelinux-7"
  - "--collection-platform-exclude 9:debian-10"
  - "--collection-platform-exclude 9:ubuntu-18.04"
  - "--collection-platform-exclude 9:ubuntu-20.04"
.github/workflows/nightly.yml:
  unmanaged: false
  cron: '50 0 * * *'
  # acceptance flags set by hand (Puppet 9 platform excludes) (MODULES-11997 pdk update)
  acceptance_flags:
  - "--nightly"
  - "--arch-exclude arm"
  - "--collection-platform-exclude 9:redhat-7"
  - "--collection-platform-exclude 9:centos-7"
  - "--collection-platform-exclude 9:oraclelinux-7"
  - "--collection-platform-exclude 9:debian-10"
  - "--collection-platform-exclude 9:ubuntu-18.04"
  - "--collection-platform-exclude 9:ubuntu-20.04"
.github/workflows/release.yml:
  unmanaged: false
.travis.yml:
  delete: true
Rakefile:
  # puppet-lint checks the module disabled by hand (Rakefile/.puppet-lint.rc) (MODULES-11997 pdk update)
  extra_disabled_lint_checks:
  - strict_indent
