name: "ci"

on:
  pull_request:
    branches:
      - "main"
  pull_request_target:
    types: [labeled]
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # On pull_request_target, github.ref is the base branch, so key on the PR number
  # (and the event) to keep runs of different PRs from cancelling each other. The
  # label is in the key so that adding another label to the same PR doesn't cancel
  # its allowed-for-ci acceptance run; re-adding allowed-for-ci still replaces it.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  Spec:
    if: github.event_name != 'pull_request_target'
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_ci.yml@main"
    secrets: "inherit"

  Acceptance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.fork == true &&
       github.event.label.name == 'allowed-for-ci')
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_acceptance.yml@main"
    with:
      flags: "--nightly --arch-exclude arm --collection-platform-exclude 9:redhat-7 --collection-platform-exclude 9:centos-7 --collection-platform-exclude 9:oraclelinux-7 --collection-platform-exclude 9:debian-10 --collection-platform-exclude 9:ubuntu-18.04 --collection-platform-exclude 9:ubuntu-20.04"
    secrets: "inherit"
